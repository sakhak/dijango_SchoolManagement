{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login School</title>

    <!-- inject:css -->
    <link rel="stylesheet" href="{% static 'core/assets/css/style.css' %}">
    <!-- endinject -->
    <link rel="shortcut icon" href="{% static 'core/assets/images/favicon.png' %}"/>
    <!--Google Font-->
    <link href="https://fonts.googleapis.com/css2?family=Kantumruy+Pro:ital,wght@0,100..700;1,100..700&display=swap"
          rel="stylesheet">


</head>

<body class="with-welcome-text">
<div class="container-scroller">
    <div class="row justify-content-center">
        <div class="col-md-6">
            <div class="card shadow-sm">
                <div class="card-body p-4">
                    <h3 class="text-center mb-4"><i class="bi bi-person-plus"></i> Create Account</h3>
                    <form method="post">
                        {% csrf_token %}
                        <div class="row">
                            {% for field in form %}
                                <div class="mb-3 col-md-6">
                                    <label class="form-label">{{ field.label }}</label>
                                    {{ field }}
                                    {% for error in field.errors %}
                                        <div class="text-danger small">{{ error }}</div>{% endfor %}
                                    {% if field.help_text %}
                                        <div class="form-text">{{ field.help_text }}</div>{% endif %}
                                </div>
                            {% endfor %}
                        </div>
                        <button type="submit" class="btn btn-primary w-100">Sign Up</button>
                    </form>
                    <p class="text-center mt-3 mb-0">Already have an account? <a
                            href="{% url 'usermanagement:login' %}">Login</a></p>
                </div>
            </div>
        </div>
    </div>
</div>
</body>
</html>
